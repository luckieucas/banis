method: mitonet
mode: predict

dataset:
  id: 1
  name: MitoEM2.0
  root: /projects/weilab/liupeng/data/raw/mito/MitoEM2.0

model:
  config_path: /projects/weilab/liupeng/code/projects/mitoem2/checkpoints/MitoNet_v1_local.yaml
  checkpoint: /projects/weilab/liupeng/code/projects/mitoem2/checkpoints/MitoNet_v1.pth

inference:
  use_gpu: true
  downsampling: 1
  confidence_thr: 0.5
  center_confidence_thr: 0.1
  min_distance_object_centers: 3
  min_size: 500
  min_extent: 5
  pixel_vote_thr: 2
  axes: [xy, xz, yz]

output:
  model_dir: /projects/weilab/liupeng/code/projects/mitoem2/checkpoints
  log_dir: null

logging:
  level: INFO
  use_wandb: false
  wandb_project: banis-tmi-baselines
  log_dir: null

eval: false
